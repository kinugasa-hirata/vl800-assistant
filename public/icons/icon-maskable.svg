<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Adaptive/Maskable Android Icons -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Inner Safe Zone Graphics -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- 3D Measurement Scanning Ring -->
    <circle cx="256" cy="210" r="130" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="14 8" opacity="0.4" />

    <!-- 3D Wireframe Cube -->
    <g filter="url(#glowMask)">
      <polygon points="256,110 350,165 256,220 162,165" fill="rgba(56, 189, 248, 0.3)" stroke="#38BDF8" stroke-width="6" />
      <polygon points="162,165 256,220 256,310 162,255" fill="rgba(37, 99, 235, 0.4)" stroke="#60A5FA" stroke-width="6" />
      <polygon points="350,165 256,220 256,310 350,255" fill="rgba(2, 132, 199, 0.5)" stroke="#0284C7" stroke-width="6" />
      <circle cx="256" cy="220" r="10" fill="#38BDF8" />
      <circle cx="256" cy="220" r="22" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
    </g>

    <!-- Typography Badge "VL-800" -->
    <rect x="116" y="350" width="280" height="74" rx="20" fill="#0B132B" stroke="#38BDF8" stroke-width="3" />
    <text x="256" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">VL-800</text>
  </g>
</svg>
