<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="6" opacity="0.6"/>

  <!-- Subtle Coordinate Grid Background -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1.5">
    <line x1="80" y1="120" x2="432" y2="120" stroke-dasharray="6 6"/>
    <line x1="80" y1="200" x2="432" y2="200" stroke-dasharray="6 6"/>
    <line x1="80" y1="280" x2="432" y2="280" stroke-dasharray="6 6"/>
    <line x1="80" y1="360" x2="432" y2="360" stroke-dasharray="6 6"/>
    <line x1="120" y1="80" x2="120" y2="432" stroke-dasharray="6 6"/>
    <line x1="200" y1="80" x2="200" y2="432" stroke-dasharray="6 6"/>
    <line x1="280" y1="80" x2="280" y2="432" stroke-dasharray="6 6"/>
    <line x1="360" y1="80" x2="360" y2="432" stroke-dasharray="6 6"/>
  </g>

  <!-- 3D Measurement Scanning Ring -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="16 10" opacity="0.4" />
  <circle cx="256" cy="220" r="110" fill="rgba(14, 165, 233, 0.05)" stroke="#38BDF8" stroke-width="2" opacity="0.3"/>

  <!-- Optical 3D Measurement Coordinate Axis & Diamond Prism -->
  <g filter="url(#glow)">
    <!-- 3D Cube / Prism Frame Wireframe -->
    <polygon points="256,110 350,165 256,220 162,165" fill="rgba(56, 189, 248, 0.25)" stroke="#38BDF8" stroke-width="5" />
    <polygon points="162,165 256,220 256,310 162,255" fill="rgba(37, 99, 235, 0.35)" stroke="#60A5FA" stroke-width="5" />
    <polygon points="350,165 256,220 256,310 350,255" fill="rgba(2, 132, 199, 0.45)" stroke="#0284C7" stroke-width="5" />

    <!-- Center Laser Measurement Reticle -->
    <circle cx="256" cy="220" r="10" fill="#38BDF8" />
    <circle cx="256" cy="220" r="22" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
    
    <!-- Laser Rays / Scan Beam -->
    <line x1="256" y1="80" x2="256" y2="105" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="315" x2="256" y2="340" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="135" y1="220" x2="160" y2="220" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="352" y1="220" x2="377" y2="220" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography Badge "VL-800" -->
  <g filter="url(#cardShadow)">
    <rect x="116" y="360" width="280" height="74" rx="20" fill="#0B132B" stroke="#38BDF8" stroke-width="3" />
    <text x="256" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">VL-800</text>
  </g>

  <!-- Small AI Sparkle Indicator -->
  <path d="M 370 120 Q 380 135 395 145 Q 380 155 370 170 Q 360 155 345 145 Q 360 135 370 120 Z" fill="#38BDF8" filter="url(#glow)"/>
</svg>
